name: Build Android Release

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies & Capacitor
        run: |
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Setup Capacitor Config
        run: |
          npx cap init "Image Compressor & Resizer in KB" com.brivaltop.imagecompressor.resizer.mbtokb --web-dir dist

      - name: Build Web App
        run: npm run build

      - name: Add Android Platform & Copy
        run: |
          rm -rf android
          npx cap add android
          npx cap copy

      - name: Inject AdMob Meta & Permissions
        run: |
          mkdir -p android/app/src/main
          cat <<EOF > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:allowBackup="true"
                  android:label="Image Compressor &amp; Resizer in KB"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-6956987079427706~5609210977"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build Unsigned AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          
